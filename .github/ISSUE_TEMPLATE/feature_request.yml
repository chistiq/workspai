name: "Feature request"
description: "Propose an improvement or new capability"
title: "[Feature]: "
type: "Feature"
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your idea with Workspai.

        Use GitHub Discussions for early design exploration. Public command and
        contract changes must follow packages/cli/CONTRIBUTING.md.
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What pain point does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe your preferred approach.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: impact
    attributes:
      label: Expected impact
      description: Who benefits and how?
    validations:
      required: true
