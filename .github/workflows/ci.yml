name: CI & Metrics Matrix

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      heavy: ${{ steps.filter.outputs.heavy }}
      phase4: ${{ steps.filter.outputs.phase4 }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            docs:
              - '**/*.md'
              - 'packages/cli/docs/**'
              - '.github/ISSUE_TEMPLATE/**'
              - '.github/assets/**'
              - '.github/contributor-issues.v1.json'
            heavy:
              - '**'
              - '!**/*.md'
              - '!packages/cli/docs/**'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/assets/**'
              - '!.github/contributor-issues.v1.json'
            phase4:
              - 'packages/cli/src/index.ts'
              - 'packages/cli/src/runtime-adapters/**'
              - 'packages/cli/src/core-bridge/**'
              - 'packages/cli/src/__tests__/phase3-cli.integration.test.ts'
              - 'packages/cli/src/__tests__/phase3-commands.test.ts'
              - 'packages/cli/src/__tests__/phase3-commands.integration.test.ts'
              - 'packages/cli/src/__tests__/init-scenarios.integration.test.ts'
              - 'packages/cli/src/__tests__/runtime-adapters.test.ts'

  docs-quality:
    name: Docs Quality (ubuntu)
    needs: changes
    if: needs.changes.outputs.docs == 'true' && needs.changes.outputs.heavy != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm --workspace workspai run build
      - run: npm run check:english-text
      - run: npm --workspace workspai run validate:docs

  phase4-fast-guard:
    name: Phase4 Fast Guard (ubuntu)
    needs: changes
    if: needs.changes.outputs.phase4 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm --workspace workspai run build

      - name: Run phase3 CLI integration fast guard
        env:
          RAPIDKIT_ENABLE_RUNTIME_ADAPTERS: "1"
        run: npm --workspace workspai run test -- src/__tests__/phase3-cli.integration.test.ts

  build-test-matrix:
    name: Build & Test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ${{ matrix.os }}
    env:
      RAPIDKIT_BUNDLE_SIZE_LIMIT_KB: "3000"

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20]

    steps:
      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      # Rust is a build-time concern only. End users receive the bundled WASM
      # artifact and never need Cargo, rustc or a runtime download.
      - name: Setup pinned Rust Graph build toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.1"
          targets: wasm32-unknown-unknown
          components: rustfmt

      # Setup Python (Linux & macOS only)
      - name: Setup Python
        if: runner.os != 'Windows'
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      # Install rapidkit-core (Python)
      - name: Install rapidkit-core (Python)
        if: runner.os != 'Windows'
        run: |
          python -m pip install --upgrade pip
          pip install rapidkit-core

      # Install Node dependencies
      - name: Install dependencies
        shell: bash
        run: |
          npm ci

          # Platform-specific Rollup optional binaries (temporary workaround)
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            npm install --workspace workspai @rollup/rollup-darwin-arm64 --save-dev --no-audit || true
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
            npm install --workspace workspai @rollup/rollup-win32-x64-msvc --save-dev --no-audit || true
          fi

      # Contract schema sync (monorepo only, opt-in via env)
      - name: Check contracts sync
        shell: bash
        env:
          RAPIDKIT_CORE_SCHEMA_PATH: ${{ env.RAPIDKIT_CORE_SCHEMA_PATH }}
        run: |
          if [[ -n "${RAPIDKIT_CORE_SCHEMA_PATH}" && -f "${RAPIDKIT_CORE_SCHEMA_PATH}" ]]; then
            npm --workspace workspai run check:contracts
          else
            echo "Skipping contract sync check (no RAPIDKIT_CORE_SCHEMA_PATH provided)"
          fi

      # Build
      - name: Build project
        run: npm --workspace workspai run build

      # Organization ownership and public-link contract
      - name: Validate Chistiq brand contract
        run: npm run check:brand

      # Independent package boundaries, evidence, mirrors and package checks
      - name: Validate independent package infrastructure
        run: npm run check:package-infrastructure

      - name: Capture Graph Rust WASM parity and performance evidence
        shell: bash
        env:
          WORKSPAI_ADMISSION_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          npm --workspace @workspai/graph run native:profile --
          --output artifacts/graph-native-parity-${{ runner.os }}.json

      - name: Upload Graph Rust WASM parity evidence
        uses: actions/upload-artifact@v4
        with:
          name: graph-native-parity-${{ runner.os }}-node-${{ matrix.node-version }}
          path: artifacts/graph-native-parity-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 30

      - name: Capture Shared standalone-admission platform evidence
        shell: bash
        env:
          WORKSPAI_PACKAGE_INFRASTRUCTURE_PASSED: "1"
        run: >-
          npm --workspace @workspai/shared run admission:audit --
          --ci-evidence --json
          --output artifacts/shared-standalone-admission-${{ runner.os }}.json

      - name: Upload Shared standalone-admission platform evidence
        uses: actions/upload-artifact@v4
        with:
          name: shared-standalone-admission-${{ runner.os }}-node-${{ matrix.node-version }}
          path: artifacts/shared-standalone-admission-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 30

      - name: Capture Graph query-admission platform evidence
        shell: bash
        env:
          WORKSPAI_PACKAGE_INFRASTRUCTURE_PASSED: "1"
          WORKSPAI_ADMISSION_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          node packages/graph/scripts/check-query-admission.mjs
          --ci-evidence --json
          --output artifacts/graph-query-admission-${{ runner.os }}.json

      - name: Upload Graph query-admission platform evidence
        uses: actions/upload-artifact@v4
        with:
          name: graph-query-admission-${{ runner.os }}-node-${{ matrix.node-version }}
          path: artifacts/graph-query-admission-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 30

      - name: Capture Graph repository-preview platform evidence
        shell: bash
        env:
          WORKSPAI_PACKAGE_INFRASTRUCTURE_PASSED: "1"
          WORKSPAI_ADMISSION_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          node packages/graph/scripts/check-repository-preview-admission.mjs
          --ci-evidence --json
          --output artifacts/graph-repository-preview-admission-${{ runner.os }}.json

      - name: Upload Graph repository-preview platform evidence
        uses: actions/upload-artifact@v4
        with:
          name: graph-repository-preview-admission-${{ runner.os }}-node-${{ matrix.node-version }}
          path: artifacts/graph-repository-preview-admission-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 30

      - name: Capture Graph G6 platform evidence
        shell: bash
        env:
          WORKSPAI_PACKAGE_INFRASTRUCTURE_PASSED: "1"
          WORKSPAI_ADMISSION_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          node packages/graph/scripts/check-g6-admission.mjs
          --ci-evidence --json
          --output artifacts/graph-g6-admission-${{ runner.os }}.json

      - name: Upload Graph G6 platform evidence
        uses: actions/upload-artifact@v4
        with:
          name: graph-g6-admission-${{ runner.os }}-node-${{ matrix.node-version }}
          path: artifacts/graph-g6-admission-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 30

      - name: Capture Graph G7 release-candidate platform evidence
        shell: bash
        env:
          WORKSPAI_PACKAGE_INFRASTRUCTURE_PASSED: "1"
          WORKSPAI_ADMISSION_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          node packages/graph/scripts/check-g7-release-candidate.mjs
          --ci-evidence
          --output artifacts/graph-g7-release-candidate-${{ runner.os }}.json

      - name: Upload Graph G7 release-candidate platform evidence
        uses: actions/upload-artifact@v4
        with:
          name: graph-g7-release-candidate-${{ runner.os }}-node-${{ matrix.node-version }}
          path: artifacts/graph-g7-release-candidate-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 30

      # Shared parity contract gate (npm <-> extension snapshot)
      - name: Validate import stack parity contract snapshot
        run: npm --workspace workspai run test:parity-contract

      # Backend operations import guard
      - name: Validate backend project import rollback guard
        run: npm --workspace workspai run test -- src/__tests__/import-project.test.ts

      # Docs quality gates (Linux only)
      - name: Validate docs quality
        if: runner.os == 'Linux'
        run: npm --workspace workspai run validate:docs

      # Lint
      - name: Run linter
        run: npm --workspace workspai run lint

      # Type check
      - name: Run type check
        run: npm --workspace workspai run typecheck

      # Format check (skip Windows)
      - name: Run format check
        if: runner.os != 'Windows'
        run: npm --workspace workspai run format:check

      # Ensure embeddings file exists for AI recommender tests
      - name: Generate mock embeddings for tests
        run: npm --workspace workspai run test:prepare-embeddings

      # Enterprise package smoke (Linux only): npm pack payload + CLI contracts + create fallbacks
      - name: Run enterprise package smoke
        if: runner.os == 'Linux'
        run: npm --workspace workspai run smoke:enterprise-package

      # Tests + coverage
      - name: Run tests with coverage
        run: npm --workspace workspai run test:coverage

      # Metrics (Linux only)
      - name: Run metrics collection
        if: runner.os == 'Linux'
        run: npm --workspace workspai run metrics

      # Bundle size guard (Linux only)
      - name: Check bundle size
        if: runner.os == 'Linux'
        run: |
          npm --workspace workspai run bundle-size
          BUNDLE_SIZE=$(du -sk packages/cli/dist/ | cut -f1)
          echo "Bundle size: ${BUNDLE_SIZE} KB"
          if [ "$BUNDLE_SIZE" -gt "${RAPIDKIT_BUNDLE_SIZE_LIMIT_KB}" ]; then
            echo "❌ Bundle size exceeds ${RAPIDKIT_BUNDLE_SIZE_LIMIT_KB} KB!"
            exit 1
          fi

      # Upload coverage (Linux only)
      - name: Upload coverage to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v4
        with:
          files: ./packages/cli/coverage/coverage-final.json
          flags: unittests
          name: rapidkit-coverage
          fail_ci_if_error: false

  graph-query-admission:
    name: Admit Graph query matrix
    needs: build-test-matrix
    if: needs.build-test-matrix.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout admitted commit
        uses: actions/checkout@v4

      - name: Download Graph query evidence
        uses: actions/download-artifact@v4
        with:
          pattern: graph-query-admission-*
          path: artifacts/graph-query-platforms
          merge-multiple: true

      - name: Verify complete Graph query matrix
        run: >-
          node packages/graph/scripts/check-query-matrix-admission.mjs
          --evidence-directory artifacts/graph-query-platforms
          --source-commit "${{ github.event.pull_request.head.sha || github.sha }}"
          --tested-commit "${{ github.sha }}"
          --output artifacts/graph-query-admission-candidate.json

      - name: Upload Graph query admission candidate
        uses: actions/upload-artifact@v4
        with:
          name: graph-query-admission-candidate
          path: artifacts/graph-query-admission-candidate.json
          if-no-files-found: error
          retention-days: 30

  graph-repository-preview-admission:
    name: Admit Graph repository preview matrix
    needs: build-test-matrix
    if: needs.build-test-matrix.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout admitted commit
        uses: actions/checkout@v4

      - name: Download Graph repository preview evidence
        uses: actions/download-artifact@v4
        with:
          pattern: graph-repository-preview-admission-*
          path: artifacts/graph-repository-preview-platforms
          merge-multiple: true

      - name: Verify complete Graph repository preview matrix
        run: >-
          node packages/graph/scripts/check-repository-preview-matrix-admission.mjs
          --evidence-directory artifacts/graph-repository-preview-platforms
          --source-commit "${{ github.event.pull_request.head.sha || github.sha }}"
          --tested-commit "${{ github.sha }}"
          --output artifacts/graph-repository-preview-admission-candidate.json

      - name: Upload Graph repository preview admission candidate
        uses: actions/upload-artifact@v4
        with:
          name: graph-repository-preview-admission-candidate
          path: artifacts/graph-repository-preview-admission-candidate.json
          if-no-files-found: error
          retention-days: 30

  graph-g6-admission:
    name: Admit Graph G6 matrix
    needs: build-test-matrix
    if: needs.build-test-matrix.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout admitted commit
        uses: actions/checkout@v4

      - name: Download Graph G6 evidence
        uses: actions/download-artifact@v4
        with:
          pattern: graph-g6-admission-*
          path: artifacts/graph-g6-platforms
          merge-multiple: true

      - name: Verify complete Graph G6 matrix
        run: >-
          node packages/graph/scripts/check-g6-matrix-admission.mjs
          --evidence-directory artifacts/graph-g6-platforms
          --source-commit "${{ github.event.pull_request.head.sha || github.sha }}"
          --tested-commit "${{ github.sha }}"
          --output artifacts/graph-g6-admission-candidate.json

      - name: Upload Graph G6 admission candidate
        uses: actions/upload-artifact@v4
        with:
          name: graph-g6-admission-candidate
          path: artifacts/graph-g6-admission-candidate.json
          if-no-files-found: error
          retention-days: 30

  graph-g7-release-candidate:
    name: Verify Graph G7 release candidate matrix
    needs: [build-test-matrix, graph-g6-admission]
    if: needs.build-test-matrix.result == 'success' && needs.graph-g6-admission.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4

      - name: Download Graph G7 platform evidence
        uses: actions/download-artifact@v4
        with:
          pattern: graph-g7-release-candidate-*
          path: artifacts/graph-g7-release-platforms
          merge-multiple: true

      - name: Download admitted Graph G6 candidate
        uses: actions/download-artifact@v4
        with:
          name: graph-g6-admission-candidate
          path: artifacts/graph-g6-candidate

      - name: Verify Graph G7 release candidate matrix
        run: >-
          node packages/graph/scripts/check-g7-release-matrix.mjs
          --evidence-directory artifacts/graph-g7-release-platforms
          --g6-candidate artifacts/graph-g6-candidate/graph-g6-admission-candidate.json
          --source-commit "${{ github.event.pull_request.head.sha || github.sha }}"
          --tested-commit "${{ github.sha }}"
          --output artifacts/graph-g7-release-candidate.json

      - name: Upload verified Graph G7 release candidate
        uses: actions/upload-artifact@v4
        with:
          name: graph-g7-release-candidate
          path: artifacts/graph-g7-release-candidate.json
          if-no-files-found: error
          retention-days: 30

  phase4-runtime-contracts:
    name: Phase4 Runtime Contracts (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.phase4 == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Workaround npm optional-deps bug (rollup on Windows)
        if: runner.os == 'Windows'
        run: npm install --workspace workspai --no-save @rollup/rollup-win32-x64-msvc

      - name: Workaround npm optional-deps bug (rollup on macOS arm64)
        if: runner.os == 'macOS'
        run: npm install --workspace workspai --no-save @rollup/rollup-darwin-arm64

      - name: Build project
        run: npm --workspace workspai run build

      - name: Generate mock embeddings for tests
        run: npm --workspace workspai run test:prepare-embeddings

      - name: Run Phase 4 adapter/contract regression suites
        env:
          RAPIDKIT_ENABLE_RUNTIME_ADAPTERS: "1"
        run: npm --workspace workspai run test -- src/__tests__/phase3-commands.test.ts src/__tests__/phase3-commands.integration.test.ts src/__tests__/phase3-cli.integration.test.ts src/__tests__/init-scenarios.integration.test.ts src/__tests__/runtime-adapters.test.ts

      - name: Run type check
        run: npm --workspace workspai run typecheck

  gate:
    name: CI Gate
    if: always()
    needs:
      [
        changes,
        docs-quality,
        phase4-fast-guard,
        build-test-matrix,
        graph-query-admission,
        graph-repository-preview-admission,
        graph-g6-admission,
        graph-g7-release-candidate,
        phase4-runtime-contracts,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required lanes
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_REQUIRED: ${{ needs.changes.outputs.docs == 'true' && needs.changes.outputs.heavy != 'true' }}
          DOCS_RESULT: ${{ needs.docs-quality.result }}
          HEAVY_REQUIRED: ${{ needs.changes.outputs.heavy == 'true' }}
          HEAVY_RESULT: ${{ needs.build-test-matrix.result }}
          GRAPH_QUERY_RESULT: ${{ needs.graph-query-admission.result }}
          GRAPH_REPOSITORY_PREVIEW_RESULT: ${{ needs.graph-repository-preview-admission.result }}
          GRAPH_G6_RESULT: ${{ needs.graph-g6-admission.result }}
          GRAPH_G7_RELEASE_RESULT: ${{ needs.graph-g7-release-candidate.result }}
          PHASE4_REQUIRED: ${{ needs.changes.outputs.phase4 == 'true' }}
          PHASE4_FAST_RESULT: ${{ needs.phase4-fast-guard.result }}
          PHASE4_MATRIX_RESULT: ${{ needs.phase4-runtime-contracts.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = "success"
          if [[ "$DOCS_REQUIRED" = "true" ]]; then
            test "$DOCS_RESULT" = "success"
          fi
          if [[ "$HEAVY_REQUIRED" = "true" ]]; then
            test "$HEAVY_RESULT" = "success"
            test "$GRAPH_QUERY_RESULT" = "success"
            test "$GRAPH_REPOSITORY_PREVIEW_RESULT" = "success"
            test "$GRAPH_G6_RESULT" = "success"
            test "$GRAPH_G7_RELEASE_RESULT" = "success"
          fi
          if [[ "$PHASE4_REQUIRED" = "true" ]]; then
            test "$PHASE4_FAST_RESULT" = "success"
            test "$PHASE4_MATRIX_RESULT" = "success"
          fi
          echo "Required CI lanes passed."
