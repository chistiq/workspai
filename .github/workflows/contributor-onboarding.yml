name: Contributor Lifecycle Messages

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  pull-requests: write

jobs:
  contributor-messages:
    if: github.event.pull_request.merged == true && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Post onboarding/retention message
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const username = context.payload.pull_request.user.login;
            const prNumber = context.payload.pull_request.number;

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'closed',
              per_page: 100,
            });

            const mergedByUser = pulls.filter((pr) =>
              pr.merged_at && pr.user && pr.user.login === username
            );

            const mergedCount = mergedByUser.length;

            let body = null;

            if (mergedCount === 1) {
              body = [
                `Hi @${username},`,
                '',
                'Welcome officially to Workspai.',
                '',
                'Your first Workspai contribution has been merged. Thank you for shipping a focused, reviewed improvement.',
                '',
                'If you would like to continue:',
                '',
                '- Choose another bounded task from the Contribution Hub',
                '- Tell us which area you want to deepen',
                '- Comment before starting so scope and acceptance evidence remain clear',
                '',
                'Contribution Hub: https://github.com/chistiq/workspai/blob/main/.github/CONTRIBUTING.md',
                '',
                'Best regards,',
                'The Workspai Team',
              ].join('\n');
            } else if (mergedCount === 3) {
              body = [
                `Hi @${username},`,
                '',
                'We wanted to take a moment to thank you for your continued contributions to Workspai.',
                '',
                'Your involvement is helping shape the future of the project, and we truly value your consistency and collaboration within the community.',
                '',
                'You are welcome to propose a larger outcome, help refine starter tasks, review fixtures and documentation, or take ownership of a clearly bounded area.',
                '',
                "We're glad to have you as part of the Workspai ecosystem.",
                '',
                'Best regards,',
                'The Workspai Team',
              ].join('\n');
            }

            if (!body) {
              core.info(`No lifecycle message for mergedCount=${mergedCount}`);
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body,
            });

            core.info(`Posted lifecycle message for @${username} (mergedCount=${mergedCount})`);
