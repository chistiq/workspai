name: Contributor Welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  first-interaction:
    runs-on: ubuntu-latest
    steps:
      - name: First issue / PR welcome
        uses: actions/first-interaction@v3
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          issue_message: |
            Hey @${{ github.actor }} — welcome to Workspai! 👋

            Thanks for taking the time to open your first issue. Clear reports and focused ideas help us make Workspai more useful for developers and AI tools working across real software workspaces.

            A maintainer will review the scope and labels. If you would like to work on this issue yourself, leave a comment and we’ll help you find the relevant contracts, code, and tests.

            Glad to have you here.
          pr_message: |
            Hi @${{ github.actor }},

            Thank you for your first contribution to Workspai.

            We really appreciate the time and effort you’ve invested. Contributions like yours help improve the ecosystem for developers worldwide.

            Our maintainers will review your pull request shortly. If any feedback or adjustments are suggested, please consider them part of our collaborative development process.

            Great start — we’re happy to have you contributing with us!

            Best regards,
            The Workspai Team
