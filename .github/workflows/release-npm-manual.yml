name: Release npm (manual gated)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to release (branch, tag, or SHA)'
        required: true
        default: 'main'
      dist_tag:
        description: 'npm dist-tag'
        required: true
        default: 'latest'
      dry_run:
        description: 'Run npm publish --dry-run only'
        required: true
        type: boolean
        default: false
concurrency:
  group: npm-release-${{ github.event.inputs.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  verify-release-gates:
    name: Verify Required Workflows Are Green
    runs-on: ubuntu-latest
    outputs:
      resolved_sha: ${{ steps.resolve_sha.outputs.sha }}

    steps:
      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0

      - name: Resolve target SHA
        id: resolve_sha
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Resolved SHA: $(git rev-parse HEAD)"

      - name: Verify required workflow runs for SHA are successful
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ steps.resolve_sha.outputs.sha }}';
            const required = [
              'CI & Metrics Matrix',
              'Security Audit',
              'Bridge Regression Smoke',
              'Workspace E2E Matrix',
              'Windows Bridge E2E',
              'Official Generator Smoke'
            ];

            const { owner, repo } = context.repo;
            const runsResp = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              head_sha: sha,
              per_page: 100
            });

            const runs = runsResp.data.workflow_runs || [];
            const latestByName = new Map();
            for (const run of runs) {
              if (!required.includes(run.name)) continue;
              // Publishing is gated by the cost-bounded primary Linux lane for
              // this exact SHA. The full Linux/macOS/Windows matrix remains a
              // scheduled/manual compatibility signal and does not block npm.
              if (
                run.name === 'Official Generator Smoke' &&
                !run.display_title?.endsWith('· primary')
              ) continue;
              const current = latestByName.get(run.name);
              if (!current || new Date(run.created_at) > new Date(current.created_at)) {
                latestByName.set(run.name, run);
              }
            }

            const missing = required.filter((name) => !latestByName.has(name));
            if (missing.length > 0) {
              core.setFailed(
                `Missing required workflow runs for ${sha}: ${missing.join(', ')}. ` +
                'Run the missing workflows and ensure they pass before publishing.'
              );
              return;
            }

            const notGreen = [];
            for (const name of required) {
              const run = latestByName.get(name);
              const ok = run.status === 'completed' && run.conclusion === 'success';
              if (!ok) {
                notGreen.push(`${name} => status=${run.status}, conclusion=${run.conclusion}`);
              }
            }

            if (notGreen.length > 0) {
              core.setFailed(
                `Required workflows are not green for ${sha}:\n- ${notGreen.join('\n- ')}`
              );
              return;
            }

            core.info(`All required workflows are green for ${sha}.`);

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: verify-release-gates
    environment: npm-production

    steps:
      - name: Checkout verified SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-release-gates.outputs.resolved_sha }}

      - name: Setup Node.js 24 (required for OIDC trusted publishing)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run release quality gates
        run: npm run validate

      - name: Build distribution
        run: npm --workspace workspai run build

      - name: Generate packaged embeddings
        run: npm --workspace workspai run test:prepare-embeddings

      - name: Run enterprise package smoke
        run: npm --workspace workspai run smoke:enterprise-package

      - name: Run alias package smoke
        run: npm --workspace wspai run smoke

      - name: Resolve npm package publish state
        id: version_guard
        shell: bash
        run: |
          set -euo pipefail
          PKG_NAME=$(node -p "require('./packages/cli/package.json').name")
          PKG_VERSION=$(node -p "require('./packages/cli/package.json').version")
          ALIAS_PKG_NAME=$(node -p "require('./packages/wspai/package.json').name")
          ALIAS_PKG_VERSION=$(node -p "require('./packages/wspai/package.json').version")
          ALIAS_DEP_VERSION=$(node -p "require('./packages/wspai/package.json').dependencies.workspai")
          echo "package_name=${PKG_NAME}" >> "$GITHUB_OUTPUT"
          echo "package_version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "alias_package_name=${ALIAS_PKG_NAME}" >> "$GITHUB_OUTPUT"
          echo "package_already_published=false" >> "$GITHUB_OUTPUT"
          echo "alias_already_published=false" >> "$GITHUB_OUTPUT"

          if [ "$ALIAS_PKG_VERSION" != "$PKG_VERSION" ]; then
            echo "${ALIAS_PKG_NAME} version (${ALIAS_PKG_VERSION}) must match ${PKG_NAME} version (${PKG_VERSION})."
            exit 1
          fi

          if [ "$ALIAS_DEP_VERSION" != "$PKG_VERSION" ]; then
            echo "${ALIAS_PKG_NAME} dependency on workspai (${ALIAS_DEP_VERSION}) must match ${PKG_VERSION}."
            exit 1
          fi

          set +e
          VIEW_OUTPUT=$(npm view "${PKG_NAME}@${PKG_VERSION}" version 2>&1)
          VIEW_STATUS=$?
          ALIAS_VIEW_OUTPUT=$(npm view "${ALIAS_PKG_NAME}@${PKG_VERSION}" version 2>&1)
          ALIAS_VIEW_STATUS=$?
          set -e

          if [ "$VIEW_STATUS" -eq 0 ]; then
            echo "${PKG_NAME}@${PKG_VERSION} is already published on npm; skipping publish."
            echo "package_already_published=true" >> "$GITHUB_OUTPUT"
          elif echo "$VIEW_OUTPUT" | grep -q "E404"; then
            echo "${PKG_NAME}@${PKG_VERSION} is available for publish."
          else
            echo "$VIEW_OUTPUT"
            exit "$VIEW_STATUS"
          fi

          if [ "$ALIAS_VIEW_STATUS" -eq 0 ]; then
            echo "${ALIAS_PKG_NAME}@${PKG_VERSION} is already published on npm; skipping publish."
            echo "alias_already_published=true" >> "$GITHUB_OUTPUT"
          elif echo "$ALIAS_VIEW_OUTPUT" | grep -q "E404"; then
            echo "${ALIAS_PKG_NAME}@${PKG_VERSION} is available for publish."
          else
            echo "$ALIAS_VIEW_OUTPUT"
            exit "$ALIAS_VIEW_STATUS"
          fi

      - name: npm publish workspai (dry-run)
        if: ${{ github.event.inputs.dry_run == 'true' && steps.version_guard.outputs.package_already_published != 'true' }}
        working-directory: packages/cli
        run: |
          npm publish --dry-run --provenance --access public --tag "${{ github.event.inputs.dist_tag }}"

      - name: npm publish wspai (dry-run)
        if: ${{ github.event.inputs.dry_run == 'true' && steps.version_guard.outputs.alias_already_published != 'true' }}
        working-directory: packages/wspai
        run: |
          npm publish --dry-run --provenance --access public --tag "${{ github.event.inputs.dist_tag }}"

      - name: npm publish workspai
        if: ${{ github.event.inputs.dry_run != 'true' && steps.version_guard.outputs.package_already_published != 'true' }}
        working-directory: packages/cli
        run: |
          npm publish --provenance --access public --tag "${{ github.event.inputs.dist_tag }}"

      - name: npm publish wspai
        if: ${{ github.event.inputs.dry_run != 'true' && steps.version_guard.outputs.alias_already_published != 'true' }}
        working-directory: packages/wspai
        run: |
          npm publish --provenance --access public --tag "${{ github.event.inputs.dist_tag }}"

      - name: Publish summary
        shell: bash
        run: |
          if [ "${{ steps.version_guard.outputs.package_already_published }}" = "true" ]; then
            echo "Skipped ${{ steps.version_guard.outputs.package_name }}@${{ steps.version_guard.outputs.package_version }} because it is already published."
          else
            echo "Published ${{ steps.version_guard.outputs.package_name }}@${{ steps.version_guard.outputs.package_version }} with dist-tag '${{ github.event.inputs.dist_tag }}'."
          fi

          if [ "${{ steps.version_guard.outputs.alias_already_published }}" = "true" ]; then
            echo "Skipped ${{ steps.version_guard.outputs.alias_package_name }}@${{ steps.version_guard.outputs.package_version }} because it is already published."
          else
            echo "Published ${{ steps.version_guard.outputs.alias_package_name }}@${{ steps.version_guard.outputs.package_version }} with dist-tag '${{ github.event.inputs.dist_tag }}'."
          fi

      - name: Refresh Workspai changelog cache
        if: ${{ github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        env:
          WORKSPAI_CHANGELOG_WEBHOOK_URL: ${{ secrets.WORKSPAI_CHANGELOG_WEBHOOK_URL }}
          WORKSPAI_CHANGELOG_WEBHOOK_SECRET: ${{ secrets.WORKSPAI_CHANGELOG_WEBHOOK_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${WORKSPAI_CHANGELOG_WEBHOOK_URL:-}" ] || [ -z "${WORKSPAI_CHANGELOG_WEBHOOK_SECRET:-}" ]; then
            echo "Workspai changelog webhook is not configured; skipping cache refresh."
            exit 0
          fi
          curl -fsS -X POST "${WORKSPAI_CHANGELOG_WEBHOOK_URL}" \
            -H "Authorization: Bearer ${WORKSPAI_CHANGELOG_WEBHOOK_SECRET}" \
            -H "Content-Type: application/json" \
            -d "{\"source\":\"npm\",\"version\":\"${{ steps.version_guard.outputs.package_version }}\"}"
          echo "Workspai changelog cache refresh requested."
