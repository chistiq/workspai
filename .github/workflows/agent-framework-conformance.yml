name: Agent Framework Adapter Matrix

on:
  schedule:
    - cron: "43 8 * * 1"
  workflow_dispatch:
    inputs:
      qualification_mode:
        description: "Fast Linux validation or complete release qualification"
        required: true
        default: full
        type: choice
        options:
          - fast
          - full

permissions:
  contents: read

concurrency:
  group: agent-framework-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    name: Validate branch and select qualification mode
    runs-on: ubuntu-latest
    outputs:
      full: ${{ (github.event_name == 'schedule' || inputs.qualification_mode == 'full') && 'true' || 'false' }}
    steps:
      - name: Require the default branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo '::error::Run Agent Framework qualification on the default branch.'
            exit 1
          fi

  microsoft-agent-framework:
    name: Microsoft Agent Framework · ${{ matrix.runtime }} · ${{ matrix.os }}
    needs: qualification
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.qualification.outputs.full == 'true' && '["ubuntu-24.04","macos-latest","windows-latest"]' || '["ubuntu-24.04"]') }}
        runtime: [python, dotnet]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: matrix.runtime == 'python'
        with:
          # Keep the Linux runner pinned so the final cross-platform Python 3.10
          # binary remains available; ubuntu-latest may advance beyond it.
          python-version: "3.10.11"

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        if: matrix.runtime == 'dotnet'
        with:
          dotnet-version: "8.0.x"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Select the committed version proposal
        working-directory: packages/cli
        run: npm exec tsx -- scripts/prepare-agent-framework-candidate.ts

      - name: Install pinned uv runtime
        if: matrix.runtime == 'python'
        run: python -m pip install uv==0.12.6

      - name: Validate contracts and adapter behavior
        run: npm --workspace workspai exec vitest -- run src/__tests__/contracts/agent-framework-contract.test.ts src/__tests__/agent-framework-registry.test.ts src/__tests__/microsoft-agent-framework-adapter.test.ts

      - name: Compile generated adapter project
        id: conformance
        working-directory: packages/cli
        run: npm exec tsx -- scripts/smoke-microsoft-agent-framework-adapter.ts --runtime ${{ matrix.runtime }} --report-dir test-results/agent-framework-conformance

      - name: Upload lane evidence
        if: always() && steps.conformance.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-framework-${{ matrix.runtime }}-${{ runner.os }}
          path: packages/cli/test-results/agent-framework-conformance
          if-no-files-found: error
          retention-days: 14

  openai-agents:
    name: OpenAI Agents SDK · ${{ matrix.runtime }} · ${{ matrix.os }}
    needs: qualification
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.qualification.outputs.full == 'true' && '["ubuntu-24.04","macos-latest","windows-latest"]' || '["ubuntu-24.04"]') }}
        runtime: [python, typescript]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.20.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: matrix.runtime == 'python'
        with:
          python-version: "3.10.11"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Select the committed version proposal
        working-directory: packages/cli
        run: npm exec tsx -- scripts/prepare-agent-framework-candidate.ts

      - name: Install pinned uv runtime
        if: matrix.runtime == 'python'
        run: python -m pip install uv==0.12.6

      - name: Validate contracts and adapter behavior
        run: npm --workspace workspai exec vitest -- run src/__tests__/contracts/agent-framework-contract.test.ts src/__tests__/agent-framework-registry.test.ts src/__tests__/openai-agents-adapter.test.ts src/__tests__/openai-agents-context-loader.test.ts src/__tests__/openai-agents-lifecycle.test.ts

      - name: Compile generated adapter project
        id: conformance
        working-directory: packages/cli
        run: npm exec tsx -- scripts/smoke-openai-agents-adapter.ts --runtime ${{ matrix.runtime }} --report-dir test-results/agent-framework-conformance

      - name: Upload lane evidence
        if: always() && steps.conformance.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-framework-openai-${{ matrix.runtime }}-${{ runner.os }}
          path: packages/cli/test-results/agent-framework-conformance
          if-no-files-found: error
          retention-days: 14

  google-adk:
    name: Google ADK · ${{ matrix.runtime }} · ${{ matrix.os }}
    needs: qualification
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.qualification.outputs.full == 'true' && '["ubuntu-24.04","macos-latest","windows-latest"]' || '["ubuntu-24.04"]') }}
        runtime: [python, typescript]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: matrix.runtime == 'python'
        with:
          python-version: "3.11"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Select the committed version proposal
        working-directory: packages/cli
        run: npm exec tsx -- scripts/prepare-agent-framework-candidate.ts

      - name: Install pinned uv runtime
        if: matrix.runtime == 'python'
        run: python -m pip install uv==0.12.6

      - name: Validate contracts and adapter behavior
        run: npm --workspace workspai exec vitest -- run src/__tests__/contracts/agent-framework-contract.test.ts src/__tests__/agent-framework-registry.test.ts src/__tests__/google-adk-adapter.test.ts src/__tests__/google-adk-lifecycle.test.ts

      - name: Compile generated adapter project
        id: conformance
        working-directory: packages/cli
        run: npm exec tsx -- scripts/smoke-google-adk-adapter.ts --runtime ${{ matrix.runtime }} --report-dir test-results/agent-framework-conformance

      - name: Upload lane evidence
        if: always() && steps.conformance.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-framework-google-adk-${{ matrix.runtime }}-${{ runner.os }}
          path: packages/cli/test-results/agent-framework-conformance
          if-no-files-found: error
          retention-days: 14

  admit-matrix:
    name: Admit complete adapter matrix
    if: github.repository == 'chistiq/workspai' && needs.qualification.outputs.full == 'true' && needs['microsoft-agent-framework'].result == 'success' && needs['openai-agents'].result == 'success' && needs['google-adk'].result == 'success'
    needs: [qualification, microsoft-agent-framework, openai-agents, google-adk]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Select the committed version proposal
        working-directory: packages/cli
        run: npm exec tsx -- scripts/prepare-agent-framework-candidate.ts

      - name: Download every conformance lane
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: agent-framework-*
          path: packages/cli/test-results/agent-framework-conformance
          merge-multiple: true

      - name: Verify evidence and admit complete matrix
        working-directory: packages/cli
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: npm exec tsx -- scripts/verify-agent-framework-conformance.ts --reports test-results/agent-framework-conformance --write-candidate test-results/agent-framework-conformance/agent-framework-admission-candidate.json --source-commit "$SOURCE_COMMIT"

      - name: Bind the verified matrix to a release admission
        working-directory: packages/cli
        run: >-
          npm exec tsx -- scripts/promote-agent-framework-release-admission.ts
          --candidate test-results/agent-framework-conformance/agent-framework-admission-candidate.json
          --output src/agent-frameworks/release-admissions.v2.json
          --repository "${{ github.repository }}"
          --source-commit "${{ github.sha }}"
          --workflow-run-id "${{ github.run_id }}"

      - name: Verify bundled admission and kit selection
        run: npm --workspace workspai exec vitest -- run src/__tests__/agent-framework-selection.test.ts src/__tests__/agent-framework-release-admission.test.ts

      - name: Export the verified baseline and admission together
        shell: bash
        run: |
          git diff --no-ext-diff HEAD -- \
            packages/cli/src/agent-frameworks/version-baselines.v1.json \
            packages/cli/src/agent-frameworks/release-admissions.v2.json \
            > packages/cli/test-results/agent-framework-conformance/release-admission.patch

      - name: Upload reviewable admission candidate
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-framework-admission-candidate-${{ github.sha }}
          path: packages/cli/test-results/agent-framework-conformance
          if-no-files-found: error
          retention-days: 30
