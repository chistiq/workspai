name: Agent Framework Version Discovery

on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-framework-version-discovery
  cancel-in-progress: true

jobs:
  discover:
    name: Discover upstream candidates
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Discover upstream version candidates
        working-directory: packages/cli
        run: >-
          npm exec tsx -- scripts/propose-agent-framework-version-update.ts
          --baseline src/agent-frameworks/version-baselines.v1.json
          --report test-results/agent-framework-version-discovery/report.json

      - name: Detect candidate changes
        id: candidate
        shell: bash
        run: |
          if git diff --quiet -- packages/cli/src/agent-frameworks/version-baselines.v1.json; then
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload reviewable candidates
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-framework-version-discovery-${{ github.sha }}
          path: packages/cli/test-results/agent-framework-version-discovery/report.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish run summary
        if: always()
        shell: bash
        env:
          CANDIDATE_AVAILABLE: ${{ steps.candidate.outputs.available }}
        run: |
          if [ "$CANDIDATE_AVAILABLE" = "true" ]; then
            echo "### Agent framework version candidates" >> "$GITHUB_STEP_SUMMARY"
            echo "Discovery found newer registry versions. This workflow does not commit, open a pull request, regenerate contracts, or admit a baseline." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```diff' >> "$GITHUB_STEP_SUMMARY"
            git diff -- packages/cli/src/agent-frameworks/version-baselines.v1.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Agent framework baselines are current" >> "$GITHUB_STEP_SUMMARY"
            echo "No admitted release-channel candidate was found." >> "$GITHUB_STEP_SUMMARY"
          fi
