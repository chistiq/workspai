name: Agent Framework Version Discovery

on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-framework-version-discovery
  cancel-in-progress: true

jobs:
  discover:
    name: Discover upstream candidates
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Discover upstream version candidates
        id: discover
        working-directory: packages/cli
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          mkdir -p test-results/agent-framework-version-discovery
          npm exec tsx -- scripts/propose-agent-framework-version-update.ts \
            --baseline src/agent-frameworks/version-baselines.v1.json \
            --report test-results/agent-framework-version-discovery/report.json \
            | tee test-results/agent-framework-version-discovery/summary.txt

      - name: Upload reviewable candidates
        if: always() && steps.discover.outcome != '' && steps.discover.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-framework-version-discovery-${{ github.sha }}
          path: |
            packages/cli/test-results/agent-framework-version-discovery/report.json
            packages/cli/test-results/agent-framework-version-discovery/proposed.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish run summary
        if: always()
        shell: bash
        run: |
          DIR=packages/cli/test-results/agent-framework-version-discovery
          BASELINE=packages/cli/src/agent-frameworks/version-baselines.v1.json
          {
            echo "### Agent framework version discovery"
            echo "Candidates require a successful admission matrix before release."
            echo
            if [ -s "$DIR/summary.txt" ]; then
              sed 's/^/    /' "$DIR/summary.txt"
            else
              echo "Discovery did not produce a summary. Check the failed step."
            fi
            if [ -f "$DIR/proposed.json" ]; then
              echo
              echo '```diff'
              diff -u "$BASELINE" "$DIR/proposed.json" || [ "$?" -eq 1 ]
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
