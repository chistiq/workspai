[package]
name = "workspai-graph-engine"
version = "0.0.0"
edition = "2021"
build = "build.rs"
publish = false
license = "MIT"
description = "Private Rust acceleration kernel for the Workspai Graph package"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "graph-compose-session"
path = "src/bin/compose-session.rs"

[[bin]]
name = "graph-compose-graph"
path = "src/bin/compose-graph.rs"

[dependencies]
